<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#fbf8f2" />
  <title>Taklifnoma</title>

  <!-- Telegram Mini App SDK: sinxron — keyingi skriptlar tayyor Telegram.WebApp'ni ko'radi -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tezlik: backend manzili va taklifnoma ma'lumotini DARHOL so'raymiz (qolgan skriptlar yuklanishini kutmaymiz) -->
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var isDev = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
      // Faqat localhost'da ?api=... bilan boshqa backend'ga ulanish mumkin (sinov uchun)
      window.BACKEND_URL = (isDev && qs.get('api')) || 'https://toy-taklifnoma.onrender.com';
      var tg = window.Telegram && window.Telegram.WebApp;
      var sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
      // ?w=<kod> (umumiy), ?g=<token> (shaxsiy), ?c=<token> (hammuallif); yoki to'g'ridan-to'g'ri startapp=w_/g_/c_
      var key = null, kind = null;
      ['w', 'g', 'c'].forEach(function (k) { var v = qs.get(k); if (!kind && v && /^[\w-]{4,40}$/.test(v)) { kind = k; key = v; } });
      if (!kind && sp) { var m = /^([wgc])_([\w-]{4,40})$/.exec(sp); if (m) { kind = m[1]; key = m[2]; } }
      window.__entry = { kind: kind, key: key };
      if (kind === 'w' || kind === 'g') {
        window.__prefetch = {
          kind: kind, key: key,
          promise: fetch(window.BACKEND_URL + '/api/invite/' + kind + '/' + encodeURIComponent(key)).then(function (r) {
            return r.json().catch(function () { return null; }).then(function (data) { return { ok: r.ok, status: r.status, data: data }; });
          }),
        };
        window.__prefetch.promise.catch(function () {});
      }
    })();
  </script>

  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="invite.css" />
</head>
<body>
  <!-- Til almashtirgich (hamma ko'rinishda) -->
  <div class="lang-switch glass" id="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="uz">UZ</button>
    <button type="button" data-lang="ru">RU</button>
    <button type="button" data-lang="ja">JA</button>
  </div>

  <!-- Yuklanmoqda -->
  <div class="view is-active" id="v-loading"><div class="loader"><i></i></div></div>

  <!-- Xabar (xato / private / topilmadi) -->
  <div class="view view-center" id="v-message">
    <div class="card glass msg-card">
      <div class="big" id="msg-ico">💌</div>
      <h2 id="msg-title"></h2>
      <p class="muted" id="msg-text"></p>
      <button class="btn ghost" id="msg-btn" type="button" hidden style="margin-top:18px"></button>
    </div>
  </div>

  <!-- Salomlashuv ekrani: ovozsiz video, yuqori burchakda yopish tugmasi -->
  <div class="view" id="v-welcome">
    <video id="welcome-video" src="welcome.mp4" poster="welcome.jpg" muted loop autoplay playsinline webkit-playsinline preload="auto" disablepictureinpicture></video>
    <button type="button" class="welcome-x" id="welcome-x" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <!-- Rol tanlash -->
  <div class="view view-center" id="v-role">
    <div class="role-wrap">
      <h1 class="role-title" data-i18n="role.title">To'y egasimisiz yoki mehmon?</h1>
      <button type="button" class="role-card glass" id="role-owner">
        <span class="ico">💍</span>
        <span><b data-i18n="role.owner">Men to'y egasiman</b><span class="d" id="role-owner-d" data-i18n="role.ownerDesc">Taklifnoma yarating va mehmonlarga yuboring</span></span>
      </button>
      <button type="button" class="role-card glass" id="role-guest">
        <span class="ico">🥂</span>
        <span><b data-i18n="role.guest">Men mehmonman</b><span class="d" data-i18n="role.guestDesc">Taklifnoma havolasi orqali oching</span></span>
      </button>
    </div>
  </div>

  <!-- Hammuallif taklifini qabul qilish -->
  <div class="view view-center" id="v-cohost">
    <div class="card glass msg-card">
      <div class="big">💑</div>
      <h2 data-i18n="cohost.title">Hammuallif taklifi</h2>
      <p class="muted" id="cohost-text"></p>
      <button class="btn primary" id="cohost-accept" type="button" style="margin-top:18px" data-i18n="cohost.accept">Qabul qilish</button>
      <p class="form-msg" id="cohost-err" hidden></p>
    </div>
  </div>

  <!-- Taklifnoma (mehmon) -->
  <div class="view" id="v-invite"></div>

  <!-- Egasi kabineti (owner.js yuklangach to'ldiriladi) -->
  <div class="view" id="v-owner"></div>

  <!-- Faqat localhost'da ?mock bilan ishlaydi (brauzerda Telegram'siz sinash uchun) -->
  <script src="dev-mock.js"></script>
  <script src="i18n.js"></script>
  <script src="templates.js"></script>
  <script src="core.js"></script>
  <script src="invite.js"></script>
  <script src="app.js"></script>
</body>
</html>
