<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#fbf8f2" />
  <title>Taklifnoma</title>

  <!-- Telegram Mini App SDK: sinxron — keyingi skriptlar tayyor Telegram.WebApp'ni ko'radi -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Tezlik: backend manzili va taklifnoma ma'lumotini DARHOL so'raymiz (qolgan skriptlar yuklanishini kutmaymiz) -->
  <script>
    (function () {
      var qs = new URLSearchParams(location.search);
      var isDev = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
      // Faqat localhost'da ?api=... bilan boshqa backend'ga ulanish mumkin (sinov uchun)
      window.BACKEND_URL = (isDev && qs.get('api')) || 'https://toy-taklifnoma.onrender.com';
      var tg = window.Telegram && window.Telegram.WebApp;
      var sp = tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param;
      // ?w=<kod> (umumiy), ?g=<token> (shaxsiy), ?c=<token> (hammuallif); yoki to'g'ridan-to'g'ri startapp=w_/g_/c_
      var key = null, kind = null;
      ['w', 'g', 'c'].forEach(function (k) { var v = qs.get(k); if (!kind && v && /^[\w-]{4,40}$/.test(v)) { kind = k; key = v; } });
      if (!kind && sp) { var m = /^([wgc])_([\w-]{4,40})$/.exec(sp); if (m) { kind = m[1]; key = m[2]; } }
      window.__entry = { kind: kind, key: key };
      if (kind === 'w' || kind === 'g') {
        window.__prefetch = {
          kind: kind, key: key,
          promise: fetch(window.BACKEND_URL + '/api/invite/' + kind + '/' + encodeURIComponent(key)).then(function (r) {
            return r.json().catch(function () { return null; }).then(function (data) { return { ok: r.ok, status: r.status, data: data }; });
          }),
        };
        window.__prefetch.promise.catch(function () {});
      }
    })();
  </script>

  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="invite.css" />
</head>
<body>
  <!-- Til almashtirgich (hamma ko'rinishda) -->
  <div class="lang-switch glass" id="lang-switch" role="group" aria-label="Language">
    <button type="button" data-lang="uz">UZ</button>
    <button type="button" data-lang="ru">RU</button>
    <button type="button" data-lang="ja">JA</button>
  </div>

  <!-- Yuklanmoqda -->
  <!-- Umumiy fon: video (salomlashuvda aniq, keyin ozgina xira) -->
  <div id="bg" aria-hidden="true"><video id="welcome-video" src="welcome.mp4" poster="welcome.jpg" muted loop playsinline webkit-playsinline preload="auto" disablepictureinpicture></video><i></i></div>
  <audio id="bg-music" src="wedding-march.mp3" loop preload="auto"></audio>
  <button type="button" class="music-btn" id="music-btn" aria-label="Music" aria-pressed="true">
    <svg class="on" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500v5h3.500L12 18.500v-13L7.500 9.500z" fill="currentColor" fill-opacity=".18"/><path d="M15.500 9a4.200 4.200 0 0 1 0 6M18 6.500a7.700 7.700 0 0 1 0 11"/></svg>
    <svg class="off" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.500v5h3.500L12 18.500v-13L7.500 9.500z" fill="currentColor" fill-opacity=".18"/><path d="M16 9.500l5 5M21 9.500l-5 5"/></svg>
  </button>
  <div class="view is-active" id="v-loading"><div class="loader"><i></i></div></div>

  <!-- Xabar (xato / private / topilmadi) -->
  <div class="view view-center" id="v-message">
    <div class="card glass msg-card">
      <div class="big" id="msg-ico">💌</div>
      <h2 id="msg-title"></h2>
      <p class="muted" id="msg-text"></p>
      <button class="btn ghost" id="msg-btn" type="button" hidden style="margin-top:18px"></button>
    </div>
  </div>

  <!-- Salomlashuv ekrani: ovozsiz video, yuqori burchakda yopish tugmasi -->
  <div class="view" id="v-welcome">
    <button type="button" class="welcome-x" id="welcome-x" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <!-- Rol tanlash -->
  <div class="view view-center" id="v-role">
    <div class="role-wrap">
      <div class="role-brand"><svg viewBox="0 0 64 56" width="46" height="40" fill="none" stroke="#b9833a" stroke-width="2.4"><circle cx="24" cy="36" r="14"/><circle cx="40" cy="36" r="14"/><path d="M32 12c-2.2-3.4-7.6-2-7.6 2 0 3 4.6 5.6 7.6 8 3-2.4 7.6-5 7.6-8 0-4-5.4-5.4-7.6-2z" fill="#e9a3a8" stroke="#c76a74" stroke-width="1.6"/></svg><span data-i18n="brand">To`yga keling</span></div>
      <h1 class="role-title" data-i18n="role.title">To'y egasimisiz yoki mehmon?</h1>
      <div class="role-sep"><i></i><svg viewBox="0 0 24 24" width="16" height="16" fill="#e08a95"><path d="M12 21s-7.5-4.6-9.5-9.2C1.2 8.6 3 5.5 6 5.5c2 0 3.3 1.2 4 2.4.7-1.2 2-2.4 4-2.4 3 0 4.8 3.1 3.5 6.3C19.5 16.4 12 21 12 21z"/></svg><i></i></div>
      <button type="button" class="role-card glass" id="role-owner">
        <span class="ico"><svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true"><defs><linearGradient id="gd1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6dc9a"/><stop offset=".5" stop-color="#c9953f"/><stop offset="1" stop-color="#8f6420"/></linearGradient><linearGradient id="gd2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#bfe3ff"/><stop offset="1" stop-color="#7fb4e6"/></linearGradient></defs><circle cx="24" cy="29" r="12.5" fill="none" stroke="url(#gd1)" stroke-width="4.4"/><circle cx="24" cy="29" r="12.5" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1" transform="translate(-.8 -.8)"/><path d="M18.5 9.5h11l4 5-9.5 10.5L14.500 14.500z" fill="url(#gd2)" stroke="#6f9fd0" stroke-width="1" stroke-linejoin="round"/><path d="M14.500 14.500h19M20.500 9.500l3.500 5 3.500-5M24 24.500l-3.500-10M24 24.500l3.500-10" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width=".9" stroke-linejoin="round"/></svg></span>
        <span class="txt"><b data-i18n="role.owner">Men to'y egasiman</b><span class="d" id="role-owner-d" data-i18n="role.ownerDesc">Taklifnoma yarating va mehmonlarga yuboring</span></span>
        <span class="chev"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
      </button>
      <button type="button" class="role-card glass" id="role-guest">
        <span class="ico"><svg viewBox="0 0 48 48" width="34" height="34" aria-hidden="true"><defs><linearGradient id="gf1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#d9c08a" stop-opacity=".9"/></linearGradient><linearGradient id="gf2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e3a6"/><stop offset="1" stop-color="#d9a64b"/></linearGradient></defs><g transform="rotate(-14 17 24)"><path d="M10.500 6h13l-1.200 15c-.3 3.600-2.300 5.600-5.300 5.600s-5-2-5.300-5.600z" fill="url(#gf1)" stroke="#b88a3e" stroke-width="1.2"/><path d="M11.600 14h10.800l-.7 7.200c-.3 3-2 4.500-4.700 4.500s-4.400-1.500-4.700-4.500z" fill="url(#gf2)" opacity=".9"/><path d="M17 26.600V38M12 38.500h10" stroke="#b88a3e" stroke-width="1.6" stroke-linecap="round" fill="none"/></g><g transform="rotate(14 31 24)"><path d="M24.500 6h13l-1.200 15c-.3 3.600-2.300 5.600-5.300 5.600s-5-2-5.300-5.600z" fill="url(#gf1)" stroke="#b88a3e" stroke-width="1.2"/><path d="M25.600 14h10.800l-.7 7.200c-.3 3-2 4.500-4.700 4.500s-4.400-1.500-4.700-4.500z" fill="url(#gf2)" opacity=".9"/><path d="M31 26.600V38M26 38.500h10" stroke="#b88a3e" stroke-width="1.6" stroke-linecap="round" fill="none"/></g><circle cx="24" cy="9" r="1.3" fill="#fff"/><circle cx="20" cy="5" r=".9" fill="#f6dc9a"/><circle cx="28.500" cy="4.500" r=".9" fill="#fff"/></svg></span>
        <span class="txt"><b data-i18n="role.guest">Men mehmonman</b><span class="d" data-i18n="role.guestDesc">Taklifnoma havolasi orqali oching</span></span>
        <span class="chev"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span>
      </button>
    </div>
  </div>

  <!-- Hammuallif taklifini qabul qilish -->
  <div class="view view-center" id="v-cohost">
    <div class="card glass msg-card">
      <div class="big">💑</div>
      <h2 data-i18n="cohost.title">Hammuallif taklifi</h2>
      <p class="muted" id="cohost-text"></p>
      <button class="btn primary" id="cohost-accept" type="button" style="margin-top:18px" data-i18n="cohost.accept">Qabul qilish</button>
      <p class="form-msg" id="cohost-err" hidden></p>
    </div>
  </div>

  <!-- Taklifnoma (mehmon) -->
  <div class="view" id="v-invite"></div>

  <!-- Egasi kabineti (owner.js yuklangach to'ldiriladi) -->
  <div class="view" id="v-owner"></div>

  <!-- Faqat localhost'da ?mock bilan ishlaydi (brauzerda Telegram'siz sinash uchun) -->
  <script src="dev-mock.js"></script>
  <script src="i18n.js"></script>
  <script src="templates.js"></script>
  <script src="core.js"></script>
  <script src="invite.js"></script>
  <script src="app.js"></script>
</body>
</html>
